name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch Ruffle (Flash emulator)
        run: |
          mkdir -p /tmp/ruffle && cd /tmp/ruffle
          npm pack @ruffle-rs/ruffle
          tar xzf ruffle-rs-ruffle-*.tgz
          dest="$GITHUB_WORKSPACE/app/src/main/assets/ruffle"
          mkdir -p "$dest"
          cp package/*.js package/*.wasm package/LICENSE_* "$dest/"
          ls -la "$dest"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      - name: Build
        shell: bash
        run: |
          set -o pipefail
          gradle assembleRelease --stacktrace --no-daemon 2>&1 | tee build-log.txt

      - name: Publish build log on failure
        if: failure()
        shell: bash
        run: |
          tail -c 300000 build-log.txt > /tmp/log.txt || echo "no log" > /tmp/log.txt
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git checkout --orphan ci-log
          git rm -rf --cached . > /dev/null
          cp /tmp/log.txt log.txt
          git add -f log.txt
          git commit -m "build log #${{ github.run_number }}"
          git push -f origin ci-log

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk tryingsome-${{ github.run_number }}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: tryingsome-${{ github.run_number }}
          path: tryingsome-${{ github.run_number }}.apk

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: "tryingsome #${{ github.run_number }}"
          files: tryingsome-${{ github.run_number }}.apk
          make_latest: true
